[project]
name = "hearing-transcripts"
version = "0.1.0"
description = "Machine transcripts of Oregon Legislature committee hearings for SessionGateway (one-time backfill)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "jsonschema>=4.26.0",
    # faster-whisper 1.2.1 passes metadata_errors to av.open, which av 19 rejects; its own pin has no upper bound.
    "av>=11,<19",
]

[project.scripts]
hearing-transcripts = "hearing_transcripts.cli:main"

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12.9.3.13",
    "nvidia-cudnn-cu12>=9.28.0.42",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearing_transcripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
