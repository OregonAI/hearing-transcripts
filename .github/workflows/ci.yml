name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The only network use is installing dependencies. The tests talk to a local fake server; no GPU.
      - run: uv sync --locked
      # No proxy may carry anything, and conftest.py blocks every connect but 127.0.0.1 and ::1.
      - run: uv run pytest
        env:
          http_proxy: ""
          https_proxy: ""
          all_proxy: ""
          no_proxy: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: ""
